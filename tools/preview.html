<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>game-alpha UI 预览台</title>
<style>
  body { margin: 0; background: #0b0d16; color: #eee; font: 13px/1.5 monospace; display: flex; gap: 16px; padding: 16px; }
  #stage { position: relative; }
  canvas { background: #1A1F35; box-shadow: 0 0 0 2px #fff, 0 12px 30px rgba(0,0,0,.6); touch-action: none; }
  aside { width: 260px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button { display: block; width: 100%; margin: 4px 0; padding: 7px 8px; background: #24304F; color: #eee; border: 1px solid #3a4a70; border-radius: 6px; font: 12px monospace; text-align: left; cursor: pointer; }
  button:hover { background: #31426c; }
  .grp { margin: 14px 0 4px; color: #8A95A5; font-size: 11px; text-transform: uppercase; }
  .pad { display: grid; grid-template-columns: 74px 1fr 46px; gap: 3px 6px; align-items: center; margin: 4px 0; }
  .pad span { color: #9fb0c8; font-size: 11px; }
  .pad input { width: 100%; box-sizing: border-box; padding: 3px 5px; background: #101728; color: #eee; border: 1px solid #3a4a70; border-radius: 4px; font: 12px monospace; }
  .pad button { margin: 0; padding: 3px 0; text-align: center; font-size: 11px; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="390" height="844"></canvas></div>
<div id="bridge" hidden></div>
<script>
// 自动化桥：注入脚本跑在 isolated world，只能碰 DOM，所以用 data-cmd 传指令、data-result 回状态
// 指令格式：nav:settings|sleep:300|shot:settings
(() => {
  const el = document.getElementById('bridge');
  const run = async (steps) => {
    for (const s of steps) {
      const i = s.indexOf(':');
      const kind = s.slice(0, i);
      const arg = s.slice(i + 1);
      if (kind === 'nav') {
        const btn = document.querySelector(`[data-nav="${arg}"]`);
        if (!btn) throw new Error('no nav ' + arg);
        btn.click();
      } else if (kind === 'sleep') {
        await new Promise((r) => setTimeout(r, Number(arg)));
      } else if (kind === 'get') {
        let v = window;
        for (const k of arg.split('.')) v = v && v[k];
        el.setAttribute('data-state', `${arg} = ${JSON.stringify(v)}`);
      } else if (kind === 'shot') {
        await window.__shot(arg);
      } else if (kind === 'tile') {
        // 与游戏同一份模块实例：拿到已生成的地面离屏画布，2×2 平铺导出看接缝
        const m = await import('./js/arena/ground.js');
        const src = m.getGroundTile();
        const c = document.createElement('canvas');
        c.width = src.width * 2;
        c.height = src.height * 2;
        const g = c.getContext('2d');
        g.drawImage(src, 0, 0);
        g.drawImage(src, src.width, 0);
        g.drawImage(src, 0, src.height);
        g.drawImage(src, src.width, src.height);
        await window.__shotCanvas(c, arg);
      }
    }
  };
  setInterval(() => {
    const cmd = el.getAttribute('data-cmd');
    if (!cmd || cmd === el.getAttribute('data-done')) return;
    el.setAttribute('data-done', cmd);
    el.removeAttribute('data-result');
    run(cmd.split('|'))
      .then(() => el.setAttribute('data-result', 'ok'))
      .catch((e) => el.setAttribute('data-result', 'err:' + e.message));
  }, 60);
})();
</script>

<script>
// wx stub：用浏览器真实 Canvas 跑游戏代码，只为看 UI，不参与打包
(() => {
  const screen = document.getElementById('game');
  let first = true;
  const handlers = { start: [], move: [], end: [], cancel: [] };
  const toLocal = (e) => {
    const r = screen.getBoundingClientRect();
    return { clientX: (e.clientX - r.left) * (screen.width / r.width), clientY: (e.clientY - r.top) * (screen.height / r.height), identifier: 1 };
  };
  const fire = (kind, e) => {
    const t = toLocal(e);
    const ev = { touches: kind === 'end' ? [] : [t], changedTouches: [t], timeStamp: Date.now() };
    for (const fn of handlers[kind]) fn(ev);
  };
  // 合成 pointer 没有真实的活跃指针，setPointerCapture 会抛 NotFoundError 把这一下整个吞掉，
  // 注入脚本发的假触摸就永远进不到游戏里（摇杆测试全瞎）。预览台自己管 touches，捕获与否无所谓
  const capture = (id) => { try { screen.setPointerCapture(id); } catch (e) { /* 忽略 */ } };
  screen.addEventListener('pointerdown', (e) => { capture(e.pointerId); fire('start', e); });
  screen.addEventListener('pointermove', (e) => { if (e.buttons) fire('move', e); });
  screen.addEventListener('pointerup', (e) => fire('end', e));
  screen.addEventListener('pointercancel', (e) => fire('cancel', e));

  const info = () => ({ windowWidth: 390, windowHeight: 844, safeArea: { top: 47, bottom: 820 }, pixelRatio: 2 });
  // 页面 hidden 时浏览器会冻结 rAF，循环会静默停摆（截图就一直停在上一帧）
  // 所以每帧同时挂 rAF 和 setTimeout，谁先到跑谁，另一个用 done 标记作废
  const realRaf = globalThis.requestAnimationFrame.bind(globalThis);
  globalThis.requestAnimationFrame = (fn) => {
    let done = false;
    const once = (t) => { if (!done) { done = true; fn(t); } };
    realRaf(once);
    setTimeout(() => once(performance.now()), 20);
    return 0;
  };
  globalThis.cancelAnimationFrame = () => {};
  globalThis.wx = {
    createCanvas: () => { if (first) { first = false; return screen; } return document.createElement('canvas'); },
    getWindowInfo: info,
    getSystemInfoSync: info,
    // 刘海机实测：胶囊在 safeArea.top 下方 4px，87x32 → 底边 83。右上簇就是照这个让位的
    getMenuButtonBoundingClientRect: () => ({ top: 51, left: 293, width: 87, height: 32, bottom: 83 }),
    createImage: () => new Image(),
    onTouchStart: (fn) => handlers.start.push(fn),
    onTouchMove: (fn) => handlers.move.push(fn),
    onTouchEnd: (fn) => handlers.end.push(fn),
    onTouchCancel: (fn) => handlers.cancel.push(fn),
    setStorageSync: (k, v) => localStorage.setItem('ga:' + k, JSON.stringify(v)),
    getStorageSync: (k) => { try { return JSON.parse(localStorage.getItem('ga:' + k)); } catch (e) { return ''; } },
    vibrateShort: () => {},
  };
})();
</script>
<script>
// 预览台自身报错也走桥：注入脚本读不到 console，只能靠 DOM 属性回传
// 必须在模块脚本之前注册：import 阶段抛错时模块体还没执行
window.__fail = (msg) => {
  const el = document.getElementById('bridge');
  el.setAttribute('data-error', String(msg));
  let box = document.getElementById('boot-error');
  if (!box) {
    box = document.createElement('pre');
    box.id = 'boot-error';
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;margin:0;padding:8px;background:#7a1d1d;color:#fff;font:11px/1.4 monospace;white-space:pre-wrap;z-index:9';
    document.body.appendChild(box);
  }
  box.textContent += msg + '\n';
};
window.addEventListener('error', (e) => window.__fail((e.message || e.error) + '\n' + ((e.error && e.error.stack) || '')));
window.addEventListener('unhandledrejection', (e) => window.__fail('promise: ' + e.reason));
</script>
<script type="module">
import Main from './js/main.js';
import databusInit from './js/databus.js';
import Player from './js/player/index.js';

const main = new Main();
const databus = new databusInit();
window.__game = { main, databus };
window.databus = databus; // 桥接探针按 databus.xxx 路径读实时状态

// 截图通道：把画布发回预览台存盘，浏览器窗口不可见时也能验收渲染结果
window.__shot = async (name) => {
  const data = document.getElementById('game').toDataURL('image/png');
  const res = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: data });
  return res.text();
};
// 离屏画布（地面贴图这类）也走同一条通道导出，用来检查平铺接缝
window.__shotCanvas = async (cv, name) => {
  const res = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: cv.toDataURL('image/png') });
  return res.text();
};
window.__nav = (name) => {
  const btn = document.querySelector(`[data-nav="${name}"]`);
  if (!btn) return 'no such nav';
  btn.click();
  return 'ok';
};

/**
 * 手动推进一帧，用于定点看技能画面和测伤害节奏。
 * 后台标签页的定时器会被 Chrome 节流到约 1 次/秒，而 main.loop 的 dt 封顶 0.05 秒
 * → 页面不可见时游戏是十几倍慢动作，按墙上时间等待的注入脚本永远等不到要看的画面。
 *
 * 做法是给 Date.now 叠一个虚拟偏移，每泵一次前进 ms（主循环的 dt 就是 ms），再跑一帧。
 * 偏移比"直接挪 main.lastTime"诚实：无敌帧、受击节流这些都读 Date.now，
 * 墙上时间在连泵之间几乎不动，会把一整轮扫射压缩成同一瞬间，测出来的伤害次数全是错的。
 * 临时把 requestAnimationFrame 换成空函数只是为了不让这一帧再申请下一帧——
 * 自动链在调用前已经 armed，不受影响；否则每泵一次就多出一条循环链。
 */
let clockOffset = 0;
const realNow = Date.now.bind(Date);
Date.now = () => realNow() + clockOffset;
window.__pump = (ms = 16.7) => {
  const m = window.__game.main;
  clockOffset += ms;
  const saved = globalThis.requestAnimationFrame;
  globalThis.requestAnimationFrame = () => 0;
  window.__pumping = true;
  try {
    m.loop();
  } finally {
    window.__pumping = false;
    globalThis.requestAnimationFrame = saved;
  }
};

/**
 * __freeze() 让自动循环空转（只对齐 lastTime，不跑逻辑），时间轴交给注入脚本独占。
 * 不冻结的话，两次注入之间浏览器自己那圈 rAF 还在偷偷走帧：Boss 被普攻打掉血、
 * 经验宝石攒够触发升级、弹窗盖住要看的画面，定点截图和伤害计数全被打乱。
 * 能替换实例上的 loop 是因为 main.js 用 requestAnimationFrame(() => this.loop()) 重挂帧，
 * 查表发生在回调里而不是挂帧时，所以自动链下一帧就会走到新的 loop。
 * __unfreeze() 交还给自动循环，页面恢复正常游玩。
 */
window.__freeze = () => {
  const m = window.__game.main;
  if (m.__autoLoop) return 'already frozen';
  m.__autoLoop = m.loop.bind(m);
  m.loop = () => {
    if (window.__pumping) {
      m.__autoLoop();
      return;
    }
    m.lastTime = Date.now();
    // 空转也得自己续帧：main.js 是在 loop() 末尾才挂下一帧的，
    // 这里直接 return 会让自动链断在第一帧上，__unfreeze() 之后页面再也跑不起来
    requestAnimationFrame(() => m.loop());
  };
  return 'frozen';
};
window.__unfreeze = () => {
  const m = window.__game.main;
  if (!m.__autoLoop) return 'already running';
  m.loop = m.__autoLoop;
  delete m.__autoLoop;
  return 'running';
};

// 开局后自动按住摇杆往右上跑，方便直接看 HUD 与战斗画面
let auto = null;
let standStill = false;
const stage = document.getElementById('game');
// 合成事件统一打 __auto 标记：真人上手时要靠它区分「这是我自己发的假事件还是手指」
function sendStick(type, x, y) {
  const r = stage.getBoundingClientRect();
  const ev = new PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, buttons: type === 'pointerup' ? 0 : 1, pointerId: 1 });
  ev.__auto = true;
  stage.dispatchEvent(ev);
}

function holdStick() {
  // 站桩偏好对所有开局按钮生效：自动跑会把 Boss 一直甩在身后（实测距离稳定 400+，射程 320 全空），
  // Boss 强度根本测不出来，所以这里必须能停
  if (auto || standStill) return;
  sendStick('pointerdown', 120, 640);
  auto = setInterval(() => sendStick('pointermove', 120 + Math.sin(Date.now() / 900) * 45, 595), 60);
  sendStick('pointermove', 120, 595);
}

// release=false 只掐定时器：手指刚按下的那一次接管不能补发 pointerup，
// 否则会把用户这根手指一起取消掉，摇杆看起来直接失灵
function setStand(on, release = true) {
  standStill = !!on;
  if (auto) { clearInterval(auto); auto = null; }
  if (standStill && release) {
    sendStick('pointerup', 120, 640);
    main.clearJoystick();
  }
  holdStick();
  const btn = document.querySelector('[data-nav="stand"]');
  if (btn) btn.textContent = standStill ? '站桩中 · 点我恢复自动跑图' : '站桩（停自动跑，让 Boss 上桌）';
  return standStill ? '站桩' : '自动跑';
}

window.__stand = (on) => setStand(on);

// 真人一按就交还控制权：预览台的自动跑图每 60ms 发一次合成 pointermove，
// 和手指拖的方向互相盖，摇杆就会「我往左滑它却往右上跳」——小程序里没有这个定时器，不会有这问题
// 这里必须用捕获阶段 + 完整 release：挂在 window 上，捕获序列比画布上的触摸处理更早，
// 所以此刻清掉合成摇杆（基准点在 120,640）不会取消用户这根手指，
// 事件继续走到游戏时正好按真实按下点重开一个基准点，往左拖就真的是往左
window.addEventListener('pointerdown', (e) => {
  if (e.__auto || standStill) return;
  setStand(true);
  say('已接管：自动跑图停了（点「站桩中」按钮可恢复）');
}, true);

function spawnAround(n) {
  const sp = databus.spawner;
  for (let i = 0; i < n; i++) sp.spawn(databus);
}

// 挤成一坨的怪：炸弹跟班挑的是「邻居最多的那一只」，散刷的怪既测不出这条索敌，
// 也拍不出一张能说明"它凭什么 4 秒才扔一枚"的截图。dx/dy 是相对角色的偏移，spread 是坨的半径
function spawnBlob(n, dx, dy, spread) {
  const sp = databus.spawner;
  const p = databus.player;
  for (let i = 0; i < n; i++) {
    sp.spawn(databus);
    const e = databus.enemys[databus.enemys.length - 1];
    const a = i * 2.39996; // 黄金角摊开：9 只挤在 44 半径里不会叠成一个点
    const r = spread * Math.sqrt((i + 0.5) / n);
    e.x = p.x + dx + Math.cos(a) * r;
    e.y = p.y + dy + Math.sin(a) * r;
  }
}

/**
 * 操作台：初始属性太低，正常打怪攒不出能扛住 Boss 的 build，所以直接写角色属性。
 * 输入框本身就是预设 —— startRun() 会把填了的值重放到刚建好的角色上，
 * 因为 main.start() 每次都是 databus.player = new Player()，只改当场那个对象不会跟着开局走。
 * key 必须与 Player 的属性名一致；末尾几条是宝箱道具的计数/像素值，改它们等于替玩家开匣。
 */
const STATS = [
  { key: 'attack', label: '攻击力', step: 5 },
  { key: 'atkSpeed', label: '攻速/秒', step: 0.1 },
  { key: 'attackRange', label: '射程', step: 20 },
  { key: 'critRate', label: '暴击率0~1', step: 0.05 },
  { key: 'critMult', label: '暴伤倍数', step: 0.5 },
  { key: 'speed', label: '移速', step: 10 },
  { key: 'defence', label: '防御', step: 2 },
  { key: 'luck', label: '幸运', step: 1 },
  { key: 'maxHp', label: '生命上限', step: 100 },
  { key: 'hp', label: '当前生命', step: 10 },
  { key: 'bulletCount', label: '子弹数', step: 1 },
  { key: 'pierce', label: '穿透', step: 1 },
  { key: 'shield', label: '护盾', step: 1 },
  { key: 'companions', label: '射击跟班', step: 1 },
  { key: 'bomber', label: '炸弹跟班', step: 1 },
  { key: 'pickupRange', label: '拾取范围', step: 30 },
  { key: 'burnBullets', label: '燃烧子弹', step: 1 },
];

// 占位符给真实出厂值，不抄常量表：一个 new Player() 就是游戏的初始 build
const REF = new Player();
document.getElementById('statpad').innerHTML = STATS
  .map((s) => `<span>${s.label}</span><input id="stat-${s.key}" type="number" step="${s.step}" placeholder="默认 ${REF[s.key]}"><button data-set="${s.key}">写</button>`)
  .join('');

const say = (msg) => { document.getElementById('padmsg').textContent = msg; };

// 空输入 = 不动这一项，所以只填攻击力也能开局
const numIn = (key) => {
  const el = document.getElementById('stat-' + key);
  if (!el || el.value === '') return null;
  const v = Number(el.value);
  return Number.isFinite(v) ? v : null;
};

// 等级只往上长：每级自动成长走 player.applyLevelBonus()，和真实升级叠出来的属性一致，
// 不会凭空造出一套游戏里达不到的 build
function growTo(p, level) {
  while (p.level < level) {
    p.level++;
    p.applyLevelBonus();
  }
}

function applyStat(key, v) {
  const p = databus.player;
  if (!p) return '未在局内';
  if (key === 'level') { growTo(p, v); return `等级 ${p.level}`; }
  if (key === 'elapsed') { databus.spawner.elapsed = v; return `开局 ${v}s`; }
  p[key] = v;
  if (key === 'maxHp') p.hp = Math.min(p.hp, p.maxHp); // 上限往下调别让血条溢出
  return `${key} = ${p[key]}`;
}

window.__applyLoadout = () => {
  const p = databus.player;
  if (!p) return '未在局内：预设会在下次开局时生效';
  const lv = numIn('level');
  // 先长等级再用属性覆盖：反过来会把每级成长叠两遍
  if (lv !== null) growTo(p, lv);
  for (const s of STATS) {
    const v = numIn(s.key);
    if (v !== null) applyStat(s.key, v);
  }
  return `已应用：攻 ${p.attack} / 攻速 ${p.atkSpeed} / 生命 ${p.hp} / Lv${p.level}`;
};

// 注入脚本用的同一扇门：写进输入框（留在预设里）并立刻作用到当前角色
window.__setStat = (key, v) => {
  const el = document.getElementById('stat-' + key);
  if (el) el.value = v;
  return applyStat(key, v);
};

// 开局秒数决定刷怪强度：操作台填了就用它，没填才用按钮自带的档位
function setElapsed(fallback) {
  const v = numIn('elapsed');
  databus.spawner.elapsed = v === null ? fallback : v;
}

// 开局：置标志后立刻泵一帧把它消费掉，别等墙上时间。
// __freeze() 之后自动链不会跑，靠 setTimeout 等的按钮会在 start() 的 databus.reset()
// 之前就把 Boss 刷好，开局瞬间又被重置抹掉
function startRun() {
  main.startRequested = true;
  window.__pump(16.7);
  window.__applyLoadout();
  setElapsed(databus.spawner.elapsed);
  holdStick();
}

document.querySelectorAll('[data-nav]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const nav = btn.dataset.nav;
    if (nav === 'reset') { localStorage.clear(); location.reload(); return; }
    if (nav === 'unlock') {
      const { MONSTER_TYPES } = await import('./js/npc/monster/config.js');
      const { markEncountered } = await import('./js/storage.js');
      Object.keys(MONSTER_TYPES).forEach((t) => markEncountered(t));
      main.backToHome();
      return;
    }
    if (nav === 'seed') {
      const { MONSTER_TYPES } = await import('./js/npc/monster/config.js');
      const { markEncountered, submitRun } = await import('./js/storage.js');
      Object.keys(MONSTER_TYPES).forEach((t) => markEncountered(t));
      [[412, 12, 388, 9], [233, 9, 174, 4], [97, 6, 61, 1], [51, 4, 22, 0], [18, 2, 7, 0]]
        .forEach(([time, level, kills, chests]) => submitRun({ time, level, kills, chests }));
      main.backToHome();
      return;
    }
    if (nav === 'main') { main.backToHome(); return; }
    if (nav === 'settings' || nav === 'codex' || nav === 'records') { main.backToHome(); databus.homeScreen.goto(nav); return; }
    if (nav.startsWith('codexDetail')) {
      const type = nav.split('-')[1];
      main.backToHome();
      if (type !== 'chest') {
        const { markEncountered } = await import('./js/storage.js');
        markEncountered(type);
      }
      databus.homeScreen.openCodex(type);
      return;
    }
    if (nav === 'stand') {
      say('移动：' + setStand(!standStill));
      return;
    }
    if (nav === 'apply') { say(window.__applyLoadout()); return; }
    if (nav === 'readout') {
      // 把当前角色抄进输入框：正常打出来的 build 就能原样重开一局拿去测 Boss
      const p = databus.player;
      if (!p) { say('未在局内，读不到角色'); return; }
      for (const s of STATS) document.getElementById('stat-' + s.key).value = p[s.key];
      document.getElementById('stat-level').value = p.level;
      document.getElementById('stat-elapsed').value = Math.round(databus.spawner.elapsed);
      say(`已读取 Lv${p.level} / ${Math.round(databus.spawner.elapsed)}s`);
      return;
    }
    if (nav === 'clearload') {
      document.querySelectorAll('.pad input').forEach((el) => { el.value = ''; });
      say('预设已清空，回到游戏初始值');
      return;
    }
    // 宝箱道具三条不打断正在打的局：只有停在首页或已结算时才新开一局
    if (nav === 'grantpet' || nav === 'chestpet' || nav === 'chestplain') {
      if (databus.screen !== 'game' || databus.isGameOver) startRun();
      const { clampToCoast } = await import('./js/arena/coast.js');
      const { default: Chest } = await import('./js/npc/chest.js');
      const place = (kind) => {
        const c = databus.pool.getItemByClass('chest', Chest);
        // 按已有匣数往右让开：连点多次不会叠在同一颗上看不清
        c.init(databus.player.x + 60 + databus.chests.length * 34, databus.player.y + 40, kind);
        clampToCoast(c, 6); // 贴着岸摆会掉到海岸线外永远捡不到
        databus.chests.push(c);
      };
      if (nav === 'grantpet') {
        const { CHEST_GRANTS } = await import('./js/npc/chestGrant.js');
        CHEST_GRANTS.pet_cmv(databus); // 和拾取同一条路：注册表直接授出跟班
        say(`融合匣已授出：跟班 ${databus.bossPets.length} 只`);
      } else if (nav === 'chestpet') {
        place('pet_cmv');
        say('Boss 融合匣已摆在右前方');
      } else {
        place(); // 不传 kind = 走七种随机加成的普通金匣
        say('普通金匣已摆在右前方');
      }
      spawnAround(4);
      return;
    }
    if (nav === 'game') { startRun(); return; }
    if (nav === 'die') {
      // 结束「正在打的这一局」：结算面板才会带上真实的破纪录标记
      if (databus.player) databus.player.hp = 0;
      databus.isGameOver = true;
      return;
    }
    if (nav === 'game3' || nav === 'boss' || nav === 'boss2' || nav === 'boss3' || nav === 'bosschest' || nav === 'petstart' || nav === 'bomberstart' || nav === 'upgrade' || nav === 'gameover' || nav === 'shield' || nav === 'chestrain') {
      startRun();
      if (nav === 'game3') {
        setElapsed(180);
        spawnAround(26);
      }
      // 手动召唤要把出场表指针推到表尾：不然自动调度器过一会儿自己又刷一只叠上来
      if (nav === 'boss') {
        const { BOSS_SCHEDULE } = await import('./js/npc/monster/config.js');
        setElapsed(200);
        databus.spawner.bossIndex = BOSS_SCHEDULE.length;
        databus.spawner.spawnBoss(databus);
        spawnAround(8);
      }
      if (nav === 'boss2') {
        const { BOSS_SCHEDULE } = await import('./js/npc/monster/config.js');
        setElapsed(250);
        databus.spawner.bossIndex = BOSS_SCHEDULE.length;
        databus.spawner.spawnBoss(databus, BOSS_SCHEDULE[1]);
        spawnAround(8);
      }
      if (nav === 'boss3') {
        const { BOSS_SCHEDULE } = await import('./js/npc/monster/config.js');
        setElapsed(370);
        databus.spawner.bossIndex = BOSS_SCHEDULE.length;
        databus.spawner.spawnBoss(databus, BOSS_SCHEDULE[2]);
        spawnAround(8);
      }
      // Boss 专属匣：直接把 boss1 掉落表里的匣摆到玩家右侧，走过去看图标/跟班/HUD 计数
      if (nav === 'bosschest') {
        const { BOSS_CHESTS } = await import('./js/npc/monster/config.js');
        const { default: Chest } = await import('./js/npc/chest.js');
        BOSS_CHESTS.boss1.forEach((k, i) => {
          const c = databus.pool.getItemByClass('chest', Chest);
          c.init(databus.player.x + 70 + i * 55, databus.player.y, k.id);
          databus.chests.push(c);
        });
        spawnAround(8);
      }
      // 带融合匣开局：不杀 Boss 也能测跟班，直接走注册表授出（和拾取同一条路）
      if (nav === 'petstart') {
        const { CHEST_GRANTS } = await import('./js/npc/chestGrant.js');
        CHEST_GRANTS.pet_cmv(databus);
        spawnAround(8);
      }
      // 操作台没填层数就给 2：一枚只能看出"它在扔"，两枚才能同时看出散布和密集索敌
      if (nav === 'bomberstart') {
        if (!databus.player.bomber) databus.player.bomber = 2;
        spawnBlob(9, 130, 0, 44);
      }
      if (nav === 'shield') { databus.player.shield += 3; spawnAround(8); }
      // 宝箱加成雨：一圈摆 16 只普通金匣（kind 为空 = 走 BONUSES 那张随机加成表那条路），跑两步就能把 HUD 右列填满
      if (nav === 'chestrain') {
        const { default: Chest } = await import('./js/npc/chest.js');
        const { clampToCoast } = await import('./js/arena/coast.js');
        for (let i = 0; i < 16; i++) {
          const a = (i / 16) * Math.PI * 2;
          const c = databus.pool.getItemByClass('chest', Chest);
          c.init(databus.player.x + Math.cos(a) * 70, databus.player.y + Math.sin(a) * 70);
          clampToCoast(c, 6); // 贴着岸摆会掉到海岸线外永远捡不到，落点和 Boss 宝石一样过一遍真实边界
          databus.chests.push(c);
        }
        spawnAround(8);
      }
      if (nav === 'upgrade') { databus.isPaused = true; databus.upgradeScreen.show(databus); }
      if (nav === 'gameover') { databus.player.hp = 0; databus.isGameOver = true; }
      return;
    }
  });
});

// 每行「写」只管这一行：改一项立刻作用到当前角色，不用重开一局
// 输入框按回车等价于点写，调数值时少一次鼠标
document.querySelectorAll('[data-set]').forEach((btn) => {
  const key = btn.dataset.set;
  const run = () => {
    const v = numIn(key);
    if (v === null) { say('先填数值'); return; }
    say(`${key} → ${applyStat(key, v)}`);
  };
  btn.addEventListener('click', run);
  document.getElementById('stat-' + key).addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
});
</script>
</body>
</html>
